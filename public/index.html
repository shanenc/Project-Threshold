<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Threshold — Gathering the Evidence</title>
  <link rel="stylesheet" href="css/homepage.css" />
  <link rel="stylesheet" href="css/fx.css" />
</head>
<body>

<main class="hero" role="main" aria-label="Project Threshold Homepage">

  <img
    class="hero__bg"
    src="images/homepage-bg.jpg"
    alt="Project Threshold — interactive neon research dashboard"
    draggable="false"
  />

  <!-- ══════════════════════════════════════════════════════
       HOTSPOT LAYER
       Positions use semantic CSS classes defined in homepage.css.
       Every coordinate was derived from the artwork's own neon
       border pixels (951x1269 source; scales proportionally).
       ══════════════════════════════════════════════════════ -->
  <div class="hotspot-layer" aria-label="Navigation hotspots">

    <a href="pages/login.html"
       class="hotspot hotspot--green hs-login"
       data-tip="Login — access your research account"
       aria-label="Login">
      <span class="hotspot__label">Login »</span>
    </a>

    <a href="pages/settings.html"
       class="hotspot hotspot--cyan hs-settings"
       data-tip="Settings — preferences, notifications, security"
       aria-label="Settings">
      <span class="hotspot__label">Settings »</span>
    </a>

    <a href="pages/report.html"
       class="hotspot hotspot--yellow hotspot--pulse hs-report"
       data-tip="Report an Experience — share your encounter"
       aria-label="Report an Experience">
      <span class="hotspot__label">Report an Experience »</span>
    </a>

    <a href="pages/overlapping-reports.html"
       class="hotspot hotspot--green hs-overlapping"
       data-tip="Overlapping Reports — cross-referenced encounters"
       aria-label="Overlapping Reports">
      <span class="hotspot__label">Open Reports »</span>
    </a>

    <a href="pages/encounter-reports.html"
       class="hotspot hotspot--magenta hs-encounter"
       data-tip="Encounter Reports — first-hand accounts"
       aria-label="Encounter Reports">
      <span class="hotspot__label">Open Reports »</span>
    </a>

    <a href="pages/fear-intimidation.html"
       class="hotspot hotspot--cyan hs-fear"
       data-tip="Fear and Intimidation — psychological impact reports"
       aria-label="Fear and Intimidation Reports">
      <span class="hotspot__label">Open Reports »</span>
    </a>

    <a href="pages/lessons.html"
       class="hotspot hotspot--orange hs-lessons"
       data-tip="Lessons and Integrated Reports — synthesised research"
       aria-label="Lessons — Integrated Reports">
      <span class="hotspot__label">Open Reports »</span>
    </a>

    <a href="pages/evidence.html"
       class="hotspot hotspot--green hs-evidence"
       data-tip="Evidence and Encounters — physical and digital archive"
       aria-label="Evidence and Encounters">
      <span class="hotspot__label">Open Reports »</span>
    </a>

    <a href="pages/explore-theory.html"
       class="hotspot hotspot--cyan hotspot--pulse hs-theory"
       data-tip="Explore the Theory — the biological derivation hypothesis"
       aria-label="Explore the Theory">
      <span class="hotspot__label">Explore the Theory »</span>
    </a>

    <a href="pages/neutralizing-fear.html"
       class="hotspot hotspot--magenta hotspot--pulse hs-neutralizing"
       data-tip="Neutralizing Fear Techniques — countermeasure research"
       aria-label="Neutralizing Fear Techniques">
      <span class="hotspot__label">Open Reports »</span>
    </a>

    <a href="pages/community.html"
       class="hotspot hotspot--cyan hs-community"
       data-tip="Community Forum — peer research and open investigations"
       aria-label="Community Forum">
      <span class="hotspot__label">Open Forum »</span>
    </a>

  </div>

</main>

<script src="js/hotspots.js"></script>
<script src="js/fx.js"></script>
</body>
</html>
