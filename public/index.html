<!-- Floating tooltip -->
<div id="tip" class="tooltip" role="tooltip" aria-hidden="true"></div>

<script>
const tip = document.getElementById('tip');
document.querySelectorAll('.hotspot[data-tip]').forEach(h => {
  h.addEventListener('mouseenter', e => { tip.textContent = h.dataset.tip; tip.classList.add('visible'); move(e); });
  h.addEventListener('mousemove', move);
  h.addEventListener('mouseleave', () => tip.classList.remove('visible'));
});
function move(e) {
  const x = e.clientX + 14, y = e.clientY + 14, tw = tip.offsetWidth, vw = window.innerWidth;
  tip.style.left = (x + tw > vw ? x - tw - 28 : x) + 'px';
  tip.style.top = y + 'px';
}
</script>
